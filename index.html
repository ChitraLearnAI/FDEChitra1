<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Interview Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>

    <div class="app">
      <div class="utility">
        <button id="resetBtn" class="ghost-btn" type="button">New conversation</button>
        <button id="keyBtn" class="ghost-btn" type="button">
          <span class="dot" id="keyDot"></span>
          <span id="keyBtnLabel">Add API key</span>
        </button>
      </div>

      <header class="title">
        <h1>AI Interview Agent</h1>
        <p>Pick the role you're interviewing for</p>
      </header>

      <main class="layout">
        <div id="roleList" class="role-list" role="radiogroup" aria-label="Choose a role"></div>

        <section class="chat" aria-label="Chat">
          <div class="chat-head">
            <div>
              <div class="chat-role" id="chatRole"></div>
              <div class="chat-sub" id="chatSub"></div>
            </div>
            <span class="model-tag">gemini-3.8-flash</span>
          </div>

          <div id="messages" class="messages" aria-live="polite"></div>

          <div id="suggestions" class="suggestions"></div>

          <form id="composer" class="composer">
            <textarea
              id="input"
              rows="1"
              placeholder="Ask a question, or say “interview me”…"
              aria-label="Message"
            ></textarea>
            <button id="sendBtn" class="send-btn" type="submit" aria-label="Send">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M3 11.5 20.5 3 13 21l-2.2-7.3L3 11.5Z" fill="currentColor" />
              </svg>
            </button>
          </form>
        </section>
      </main>
    </div>

    <dialog id="keyDialog" class="key-dialog">
      <form method="dialog" id="keyForm">
        <h2>Connect Gemini</h2>
        <p>
          Paste your Gemini API key to start. It stays in this browser and is sent only to
          Google's Gemini API. Get one at
          <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>.
        </p>
        <label for="keyInput">API key</label>
        <input id="keyInput" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…" />
        <label class="remember">
          <input type="checkbox" id="rememberKey" checked />
          Remember on this device
        </label>
        <div class="dialog-actions">
          <button type="button" id="clearKeyBtn" class="ghost-btn">Remove key</button>
          <button type="submit" value="save" class="primary-btn">Save key</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
